name: Deploy Civara Education to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "education/**"
      - ".github/workflows/pages.yml"
      - ".nojekyll"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Pages site
        run: |
          rm -rf _site
          mkdir -p _site/education
          cp -R education/. _site/education/
          cp .nojekyll _site/.nojekyll
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=education/">
            <title>Civara Workshop — Kashmir Pashmina Education</title>
          </head>
          <body>
            <p>Opening <a href="education/">Kashmir Pashmina Education</a>…</p>
          </body>
          </html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
