name: Deploy Civara Website to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "education/**"
      - "fr/**"
      - "es/**"
      - "de/**"
      - "ar/**"
      - "ur/**"
      - ".github/workflows/pages.yml"
      - ".nojekyll"
      - "CNAME"
      - "*.jpg"
      - "*.JPG"
      - "*.jpeg"
      - "*.JPEG"
      - "*.png"
      - "*.PNG"
      - "*.webp"
      - "*.WEBP"
      - "*.mp4"
      - "*.MP4"
      - "index.html"
      - "shop.html"
      - "wholesale.html"
      - "workshop.html"
      - "journey.html"
      - "journal.html"
      - "guest-house.html"
      - "chai.html"
      - "story.html"
      - "contact.html"
      - "styles.css"
      - "app.js"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Pages site
        run: |
          rm -rf _site
          mkdir -p _site/education
          cp -R education/. _site/education/
          cp -R fr es de ar ur _site/
          cp .nojekyll _site/.nojekyll
          cp CNAME _site/CNAME
          cp ./*.jpg ./*.JPG ./*.jpeg ./*.JPEG ./*.png ./*.PNG ./*.webp ./*.WEBP ./*.mp4 ./*.MP4 _site/ 2>/dev/null || true
          cp index.html _site/index.html
          cp shop.html _site/shop.html
          cp wholesale.html _site/wholesale.html
          cp workshop.html _site/workshop.html
          cp journey.html _site/journey.html
          cp journal.html _site/journal.html
          cp guest-house.html _site/guest-house.html
          cp chai.html _site/chai.html
          cp story.html _site/story.html
          cp contact.html _site/contact.html
          cp styles.css _site/styles.css
          cp app.js _site/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
