name: Deploy Civara Website to GitHub Pages

on:
  push:
    branches: ["main", "civara-new-website"]
    paths:
      - "education/**"
      - ".github/workflows/pages.yml"
      - ".nojekyll"
      - "index.html"
      - "styles.css"
      - "app.js"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Pages site
        run: |
          rm -rf _site
          mkdir -p _site/education
          cp -R education/. _site/education/
          cp .nojekyll _site/.nojekyll
          cp index.html _site/index.html
          cp styles.css _site/styles.css
          cp app.js _site/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
