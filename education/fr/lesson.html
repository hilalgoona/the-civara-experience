<script>
const data={
"01":{img:"../images/lesson01-fibre.jpg",t:"Qu’est-ce que le Pashmina ?",i:"Une fibre animale naturelle et fine, au début d’un long voyage textile.",h:"Le Pashmina est une fibre — pas un châle.",p:["Le terme Pashmina désigne une fibre animale naturelle et fine provenant du sous-poil de certaines chèvres de l’Himalaya. Le Pashmina traditionnel associé au Cachemire est étroitement lié à la chèvre Changthangi, élevée dans les régions de haute altitude du Ladakh et de l’Himalaya.","Un châle est un textile fabriqué à partir de fil. La fibre peut passer par plusieurs étapes : collecte, nettoyage, déhairage, cardage, filage, tissage et finition.","Les expressions « filé à la main » et « filé à la machine » décrivent des méthodes de production différentes. Un filage mécanique ne signifie pas automatiquement que la fibre n’est pas du Pashmina. L’identité de la fibre et la méthode de filage sont deux questions distinctes."],b:["La douceur, à elle seule, ne prouve pas la composition de la fibre.","Une description responsable distingue la fibre, le filage, le tissage et les ornements."]},
"02":{img:"../images/lesson02-goat.jpg",v:"../images/pashmina-goats.mp4",vt:"Une chèvre au cœur du paysage himalayen",vc:"Images originales de Civara Workshop montrant les chèvres et leur environnement.",t:"La chèvre de l’Himalaya : là où commence le Pashmina",i:"L’animal, le paysage et le savoir pastoral à l’origine de la fibre.",h:"Un sous-poil d’hiver façonné par un environnement rude.",p:["La chèvre Changthangi est étroitement associée à la production traditionnelle de fibres fines de Pashmina dans la région de Changthang, en haute altitude au Ladakh. Son pelage comprend des poils de garde plus grossiers et un sous-poil isolant plus fin.","Le sous-poil fin est recueilli pendant la période saisonnière de mue. La matière brute peut contenir des fibres fines, des poils grossiers, de la poussière et des débris végétaux ; elle doit donc être préparée avant le filage."],b:["Paysage himalayen → chèvre → sous-poil fin → fibre préparée → fil → textile."]},
"03":{img:"../images/lesson03-raw-fibre.jpg",t:"De la fibre brute au Pashmina : nettoyage et déhairage",i:"Préparer la matière première avant de la transformer en fil.",h:"La fibre brute n’est pas encore prête à être tissée.",p:["La fibre collectée contient le sous-poil fin recherché, mais aussi des poils de garde plus grossiers, de la poussière, des végétaux et d’autres matières naturelles.","Le nettoyage retire les matières indésirables. Le déhairage sépare les fibres fines des poils de garde plus grossiers. Ces opérations peuvent être réalisées manuellement, selon des méthodes traditionnelles, ou à l’aide d’équipements mécaniques modernes.","Une fois préparée, la fibre peut passer au cardage puis au filage."],b:["La méthode de traitement et l’identité de la fibre sont deux questions distinctes."]},
"04":{img:"../images/lesson04-yarn.jpg",t:"Cardage et filage : transformer la fibre en fil",i:"Ouvrir, aligner et tordre les fibres préparées pour former un fil continu.",h:"La fibre libre devient un fil utilisable.",p:["Le cardage ouvre et organise les fibres. Il aide à retirer les dernières impuretés et prépare la matière au filage.","Le filage transforme les fibres en un fil continu en les étirant et en leur donnant une torsion. Au Cachemire, le filage traditionnel à la main est notamment associé au charkha, le rouet traditionnel.","Le fil filé à la main peut présenter de légères variations, tandis que le filage mécanique peut offrir davantage de régularité et de capacité de production. Aucun de ces termes ne détermine à lui seul la composition de la fibre."],b:["Le parcours de la matière mène maintenant au fil de Pashmina."]},
"05":{img:"../images/lesson05-loom.jpg",v:"../images/06.mp4",vt:"Un artisan au métier à tisser",vc:"Images originales de Civara Workshop montrant le métier, la chaîne et le rythme du tissage à la main.",t:"Préparer le métier à tisser : du fil au tissu",i:"Comprendre comment la chaîne et la trame transforment le fil en étoffe.",h:"Le métier à tisser donne sa structure au fil.",p:["Le métier à tisser maintient les fils et permet de former le tissu. Les fils de chaîne s’étendent dans le sens de la longueur ; le fil de trame passe transversalement entre eux.","La préparation de la chaîne consiste à mesurer, ordonner et installer les fils avec une tension adaptée. Le tissage entrelace ensuite la chaîne et la trame selon un rythme maîtrisé.","Le tissage traditionnel à la main au Cachemire demande coordination, expérience et attention à la tension, à la structure et au rythme du travail."],b:["Le tissage simple peut être élégant en lui-même. Sozni et Kani sont des traditions distinctes qui peuvent intervenir ensuite ou selon d’autres méthodes."]},
"06":{img:"../images/lesson06-sozni.jpg",t:"Sozni : l’art de la broderie fine du Cachemire",i:"Un travail d’aiguille délicat, réalisé point après point.",h:"Le tissu devient une toile pour l’aiguille.",p:["Sozni est une tradition cachemirienne de broderie fine à la main. Les motifs peuvent représenter des fleurs, des feuilles, des vignes, des paisleys, des oiseaux et des bordures répétitives.","Le dessin peut être reporté ou marqué comme guide. L’artisan travaille ensuite point par point, en maîtrisant la direction, l’espacement, la tension, les couleurs et la symétrie.","La quantité et la complexité de la broderie influencent le temps et le travail nécessaires. Sozni est une tradition vivante, et non une simple décoration."],b:["La nature est une source d’inspiration importante dans les motifs textiles du Cachemire."]},
"07":{img:"../images/lesson07-kani.jpg",t:"Kani : l’art du tissage à motifs du Cachemire",i:"Créer le motif dans l’étoffe au moment même du tissage.",h:"Avec Kani, le motif fait partie du tissage.",p:["Kani est une tradition cachemirienne de tissage à motifs. Au lieu d’ajouter le dessin plus tard à l’aiguille, le motif est construit directement pendant le tissage.","De petits outils en bois appelés kanis permettent d’introduire des fils de couleur dans des zones précises. Les dessins complexes exigent une planification attentive et une lecture précise du motif.","Sozni et Kani sont différents : Sozni est une broderie ajoutée à un textile déjà tissé ; Kani crée le motif par le processus même du tissage."],b:["Kani est étroitement associé à la tradition textile du Jamawar."]},
"08":{img:"../images/lesson08-finished.jpg",t:"Les finitions du Pashmina : du tissu au châle fini",i:"Inspection, finitions et préparation soigneuse du textile.",h:"La dernière étape fait partie de l’histoire du textile.",p:["Après le tissage et, le cas échéant, la broderie, le textile doit être inspecté et recevoir les finitions adaptées. Selon la pièce, cela peut comprendre le nettoyage, la correction de fils lâches, le lavage ou d’autres traitements, le séchage, le pressage et la finition des bords.","Les pratiques exactes varient selon la fibre, le tissage, la broderie et l’usage prévu. Les textiles fins nécessitent une manipulation soigneuse."],b:["Les finitions ne prouvent pas, à elles seules, l’identité de la fibre."]},
"09":{img:"../images/lesson09-gi.jpg",t:"Comment reconnaître un Pashmina authentique",i:"Aller au-delà du toucher, des étiquettes et des tests informels.",h:"L’authenticité dépend notamment de la composition de la fibre.",p:["La douceur, le toucher, le test de l’anneau ou le test de combustion ne constituent pas une preuve scientifique concluante de la composition de la fibre. « Tissé à la main », « fait main » et « filé à la main » décrivent des méthodes de production ; ils ne déterminent pas automatiquement la nature de la fibre.","Une analyse en laboratoire peut apporter des éléments plus solides, selon la question posée et la méthode d’essai utilisée. Les documents utiles peuvent inclure des informations sur la fibre, des rapports d’essai, des documents liés à une indication géographique lorsque cela s’applique, des renseignements sur le fournisseur ou l’artisan et des documents commerciaux.","Un acheteur peut demander : quelle est la composition de la fibre ? Comment le fil a-t-il été filé ? Comment le textile a-t-il été tissé ? Quels tests ou documents étayent la description ?"],b:["Il n’existe pas de test miracle unique pour le Pashmina."]},
"10":{img:"../images/lesson10-cashmere.jpg",t:"Pashmina et cachemire : comprendre les appellations",i:"Deux termes proches, associés à des contextes géographiques et culturels différents.",h:"Les noms comptent — mais le contexte compte davantage.",p:["Le terme international « cashmere » désigne largement une fibre animale fine provenant de certaines chèvres productrices de cachemire. Le Pashmina est fortement associé à l’Himalaya et au Cachemire ; le terme peut désigner une fibre fine comme des traditions textiles cachemiriennes.","Un vêtement en cachemire fabriqué ailleurs n’est pas automatiquement un châle traditionnel en Pashmina du Cachemire. Inversement, une étiquette ne suffit pas à établir la composition de la fibre.","Posez trois questions : de quelle fibre s’agit-il ? D’où vient-elle ? Comment le textile fini a-t-il été fabriqué ?"],b:["Au Cachemire, le Pashmina porte aussi l’histoire du filage, du tissage, de Sozni, de Kani, du Jamawar et du savoir transmis entre générations."]},
"11":{img:"../images/02_artisan_fibre.jpg",t:"L’artisan : les mains derrière le Pashmina",i:"Les personnes dont le savoir transforme la fibre en textile et la tradition en pratique vivante.",h:"Le temps est un ingrédient invisible.",p:["Un textile en Pashmina peut mobiliser plusieurs savoir-faire : préparation de la fibre, filage, tissage, broderie, tissage Kani, création des motifs et finitions.","Le savoir s’acquiert souvent par la pratique, l’observation, la répétition et la correction. Plusieurs artisans apportent des compétences différentes ; la pièce finale est le fruit de leur travail combiné.","Soutenir l’artisanat, c’est aussi reconnaître une rémunération équitable, des conditions de travail sûres, la formation, l’accès au marché et, lorsque cela est approprié, la mention du nom des artisans."],b:["Les mains apprennent ce que les livres ne peuvent pas entièrement transmettre."]},
"12":{img:"../images/hero-real-workshop.jpg",t:"Le Pashmina et l’avenir : préserver une tradition vivante",i:"Comment transmettre les savoirs traditionnels malgré l’évolution des technologies et des marchés.",h:"Préserver ne signifie pas figer une tradition dans le temps.",p:["Le Pashmina est une tradition vivante. Elle peut évoluer tout en conservant ses savoirs essentiels et sa signification culturelle.","Les technologies modernes peuvent aider au traitement de la fibre, au contrôle qualité, aux analyses de laboratoire, à la documentation, à la photographie, à la communication et au commerce international. Les procédés manuels et mécaniques peuvent coexister lorsque leur usage est décrit honnêtement.","L’avenir dépend aussi des moyens de subsistance des artisans, de l’apprentissage, de la reconnaissance, de l’accès au marché et d’une bonne documentation grâce aux photographies, aux entretiens, aux vidéos et aux archives."],b:["De la fibre himalayenne à l’avenir : la nature, le savoir-faire, les personnes et une histoire racontée avec responsabilité restent liés."]}
};
