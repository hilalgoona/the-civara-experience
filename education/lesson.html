<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pashmina Lesson — Civara Workshop</title><link rel="stylesheet" href="styles.css"></head><body class="lesson-page"><header class="nav"><a class="brand" href="index.html">CIVARA <span>WORKSHOP</span></a><a class="nav-cta" href="index.html#journey">All lessons →</a></header><main><section class="lesson-hero"><a class="back" href="index.html#journey">← Back to the journey</a><p class="eyebrow" id="num"></p><h1 id="title"></h1><p class="lead" id="intro"></p><figure class="lesson-hero-art"><img id="lesson-image" alt="" fetchpriority="high"></figure></section><article class="lesson-body" id="body"></article><nav class="lesson-nav"><a id="prev"></a><a id="next"></a></nav></main><script>
const data={
"01":{img:"images/lesson01-fibre.jpg",t:"What Is Pashmina?",i:"A fine natural animal fibre, and the beginning of a much longer textile journey.",h:"Pashmina is a fibre — not a shawl.",p:["Pashmina refers to a fine natural animal fibre obtained from the undercoat of certain Himalayan goats. Traditional Pashmina associated with Kashmir is closely connected to the Changthangi goat of the high-altitude Ladakh/Himalayan region.","A shawl is a textile made from yarn. The fibre goes through a sequence that can include collection, cleaning, dehairing, carding, spinning, weaving and finishing.","Hand-spun and machine-spun describe different production methods. Machine-spun does not automatically mean non-Pashmina. Fibre identity and spinning method are separate questions."],b:["Softness alone does not prove fibre composition.","A responsible description should distinguish fibre, spinning, weaving and embellishment."]},
"02":{img:"images/lesson02-goat.jpg",v:"images/pashmina-goats.mp4",t:"The Himalayan Goat: Where Pashmina Begins",i:"The animal, landscape and pastoral knowledge at the source of the fibre.",h:"A winter undercoat shaped by a harsh environment.",p:["The Changthangi goat is closely associated with traditional fine Pashmina production in the high-altitude Changthang region of Ladakh. Its coat includes coarser guard hair and a finer insulating undercoat.","The fine undercoat is collected during the seasonal shedding period. Raw material can contain fine fibre together with coarse hair, dust and vegetation, so it must be prepared before spinning."],b:["Himalayan landscape → goat → fine undercoat → prepared fibre → yarn → textile."]},
"03":{img:"images/lesson03-raw-fibre.jpg",t:"From Raw Fibre to Pashmina: Cleaning and Dehairing",i:"Preparing the raw material before it becomes yarn.",h:"Raw fibre is not ready to weave.",p:["Collected fibre contains desirable fine undercoat fibre alongside coarse guard hairs, dust, vegetation and other natural material.","Cleaning removes unwanted material. Dehairing separates the finer fibres from coarser guard hairs. Traditional/manual and modern/mechanical approaches can both be used.","The prepared fibre then moves toward carding and spinning."],b:["Processing method and fibre identity are separate questions."]},
"04":{img:"images/lesson04-yarn.jpg",t:"Carding and Spinning: Turning Fibre Into Yarn",i:"Opening, aligning and twisting prepared fibre into continuous yarn.",h:"Loose fibre becomes a usable thread.",p:["Carding opens and organizes the fibres, helping remove remaining impurities and prepare them for spinning.","Spinning turns loose fibres into a continuous yarn by drawing the fibres and introducing twist. Traditional Kashmiri hand-spinning is associated with the charkha.","Hand-spun yarn may show subtle variation, while machine spinning can provide consistency and scale. Neither label by itself answers the question of fibre composition."],b:["The journey now reaches Pashmina yarn."]},
"05":{img:"images/lesson05-loom.jpg",t:"Preparing the Loom: From Yarn to Weaving",i:"Understanding how warp and weft transform yarn into cloth.",h:"The loom gives the yarn structure.",p:["A loom holds yarn and creates fabric. Warp threads run lengthwise; weft yarn passes across them.","Warp preparation involves measuring, arranging and mounting the threads under appropriate tension. Weaving then interlaces warp and weft in a controlled rhythm.","Traditional Kashmiri hand weaving involves coordinated movement, experience and attention to tension, structure and pace."],b:["Plain weaving can be elegant on its own. Sozni and Kani are distinct craft traditions that may come later or be integrated differently."]},
"06":{img:"images/lesson06-sozni.jpg",t:"Sozni: The Art of Kashmiri Hand Embroidery",i:"Fine needlework built stitch by stitch.",h:"A woven textile becomes a canvas for the needle.",p:["Sozni is a traditional Kashmiri fine hand-embroidery tradition. Designs can include flowers, leaves, vines, paisley, birds and repeating borders.","A design may be transferred or marked as a guide. The artisan then works stitch by stitch, controlling direction, spacing, tension, colour and symmetry.","The amount and complexity of embroidery affect the time and labour involved. Sozni is a living tradition, not simply decoration."],b:["Nature is an important source of inspiration in Kashmiri textile design."]},
"07":{img:"images/lesson07-kani.jpg",t:"Kani: The Art of Patterned Kashmiri Weaving",i:"Building a design into the cloth while the cloth is being woven.",h:"With Kani, the pattern is part of the weaving.",p:["Kani is a traditional Kashmiri patterned weaving tradition. Rather than adding a design later with a needle, the pattern is built during weaving.","Small wooden Kani tools carry coloured yarn into selected areas. Complex designs require careful planning and pattern mapping.","Sozni and Kani are different: Sozni is embroidery added to a woven textile; Kani creates the pattern through the weaving process itself."],b:["Kani is closely associated with the Jamawar textile tradition."]},
"08":{img:"images/lesson08-finished.jpg",t:"Finishing the Pashmina: From Woven Textile to Finished Shawl",i:"Inspection, finishing and careful preparation of the textile.",h:"The final stage is part of the story.",p:["After weaving and any embroidery, the textile needs inspection and appropriate finishing. Depending on the textile, this can include cleaning, correction of loose threads, washing or other finishing treatments, drying, pressing and edge finishing.","Exact finishing practices vary with the fibre, weave, embroidery and intended product. Fine textiles require careful handling."],b:["Finishing does not, by itself, prove fibre identity."]},
"09":{img:"images/lesson09-gi.jpg",t:"How to Understand Genuine Pashmina",i:"Looking beyond touch, labels and informal tests.",h:"Genuine fundamentally concerns fibre composition.",p:["Softness, touch, a ring test or a burn test are not conclusive scientific proof of fibre composition. Handwoven, handmade and hand-spun describe production methods; they do not automatically establish what the fibre is.","Laboratory testing can provide stronger evidence, with the exact test depending on the question being asked. Supporting documentation may include fibre information, test reports, GI-related records where applicable, supplier or artisan information and commercial records.","A buyer can ask: What is the fibre composition? How was the yarn spun? How was the textile woven? What testing or documentation supports the description?"],b:["There is no single magic test for Pashmina."]},
"10":{img:"images/lesson10-cashmere.jpg",t:"Pashmina and Cashmere: Understanding the Names",i:"Two closely related terms that can carry different geographic and cultural contexts.",h:"Names matter — but context matters more.",p:["Cashmere is a broad international textile term for fine animal fibre from certain cashmere-producing goats. Pashmina has a strong Himalayan and Kashmir association and can refer both to fine fibre and to Kashmiri textile traditions.","A cashmere garment made elsewhere is not automatically a traditional Kashmiri Pashmina shawl. Conversely, the label alone cannot establish fibre composition.","Ask three questions: What is the fibre? Where did it come from? How was the finished textile made?"],b:["Pashmina in Kashmir also carries a history of spinning, weaving, Sozni, Kani, Jamawar and generations of artisan knowledge."]},
"11":{img:"images/02_artisan_fibre.jpg",t:"The Artisan: The Human Hands Behind Pashmina",i:"The people whose knowledge turns fibre into textile and tradition into living practice.",h:"Time is an invisible ingredient.",p:["A Pashmina textile can involve several kinds of skilled work: fibre preparation, spinning, weaving, embroidery, Kani weaving, design and finishing.","Knowledge is often learned through practice, observation, repetition and correction. Different artisans contribute different skills, and the final textile represents their combined work.","Supporting craft also means recognising fair payment, safe working conditions, training, market access and attribution where appropriate."],b:["Hands learn what books cannot fully teach."]},
"12":{img:"images/hero-real-workshop.jpg",t:"Pashmina and the Future: Preserving a Living Tradition",i:"How traditional knowledge can continue while technology and markets change.",h:"Preservation does not mean freezing a tradition in time.",p:["Pashmina is a living tradition. It can evolve while retaining its core knowledge and cultural meaning.","Modern technology can support fibre processing, quality control, laboratory testing, documentation, photography, communication and international trade. Hand and machine processes can coexist when they are described honestly.","The future also depends on artisan livelihoods, apprenticeships, recognition, market access and good documentation through photographs, interviews, video and archives."],b:["From Himalayan fibre to the future: nature, skill, people, knowledge and responsible storytelling remain connected."]}
};
