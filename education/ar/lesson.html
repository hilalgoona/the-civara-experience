<script>
const data={
"01":{img:"../../images/lesson01-fibre.jpg",t:"ما الباشمينا؟",i:"ألياف حيوانية طبيعية دقيقة، وبداية رحلة نسيجية طويلة.",h:"الباشمينا ألياف، وليست شالًا بحد ذاتها.",p:["تشير الباشمينا إلى ألياف حيوانية طبيعية دقيقة تُستخرج من الطبقة الداخلية الناعمة لفراء بعض الماعز التي تعيش في جبال الهيمالايا. وترتبط الباشمينا التقليدية في كشمير ارتباطًا وثيقًا بماعز تشانغثانغي في منطقة لداخ المرتفعة في الهيمالايا.","الشال نسيج يُصنع من الخيوط. وتمر الألياف عادةً بمراحل متتابعة قد تشمل الجمع والتنظيف وفصل الشعر الخشن والتمشيط والغزل والنسيج والتشطيب.","يشير الغزل اليدوي والغزل الآلي إلى طريقتين مختلفتين للإنتاج. ولا يعني الغزل الآلي تلقائيًا أن الألياف ليست باشمينا؛ فتركيب الألياف وطريقة غزلها مسألتان منفصلتان."],b:["النعومة وحدها لا تثبت تركيب الألياف.","ينبغي للوصف المسؤول أن يميّز بين نوع الألياف والغزل والنسيج والزخرفة."]},
"02":{img:"../../images/lesson02-goat.jpg",v:"../../images/pashmina-goats.mp4",t:"ماعز الهيمالايا: من أين تبدأ الباشمينا؟",i:"الحيوان والمنظر الطبيعي والمعرفة الرعوية في أصل الألياف.",h:"طبقة داخلية شتوية تكيّفت مع بيئة قاسية.",p:["يرتبط ماعز تشانغثانغي بإنتاج ألياف الباشمينا الدقيقة التقليدية في منطقة تشانغثانغ المرتفعة في لداخ. ويتكوّن فراؤه من شعر خارجي خشن وطبقة داخلية أدق تساعده على العزل والحماية من البرد.","تُجمع الطبقة الداخلية الناعمة خلال فترة تبدّل الفراء الموسمية. وقد تحتوي المادة الخام على ألياف دقيقة وشعر خشن وغبار وبقايا نباتية، لذلك تحتاج إلى المعالجة قبل الغزل."],b:["منظر الهيمالايا ← الماعز ← الطبقة الداخلية الناعمة ← الألياف المهيّأة ← الخيوط ← النسيج."]},
"03":{img:"../../images/lesson03-raw-fibre.jpg",t:"من الألياف الخام إلى الباشمينا: التنظيف وفصل الشعر الخشن",i:"تهيئة المادة الخام قبل تحويلها إلى خيوط.",h:"الألياف الخام ليست جاهزة للنسيج.",p:["تحتوي الألياف المجموعة على الطبقة الداخلية الناعمة المطلوبة، إلى جانب شعر الحماية الخشن والغبار وبقايا النباتات ومواد طبيعية أخرى.","يزيل التنظيف المواد غير المرغوبة، بينما يفصل نزع الشعر الخشن الألياف الدقيقة عن الشعيرات الخارجية الأكثر خشونة. ويمكن استخدام أساليب تقليدية يدوية أو وسائل حديثة ميكانيكية.","بعد تهيئتها، تنتقل الألياف إلى مراحل التمشيط والغزل."],b:["طريقة المعالجة وهوية الألياف مسألتان منفصلتان."]},
"04":{img:"../../images/lesson04-yarn.jpg",t:"التمشيط والغزل: تحويل الألياف إلى خيوط",i:"فتح الألياف وترتيبها ولفّها لتصبح خيطًا متصلًا.",h:"تتحول الألياف المفككة إلى خيط صالح للاستخدام.",p:["يفتح التمشيط الألياف وينظمها، ويساعد على إزالة ما تبقى من الشوائب وتجهيزها للغزل.","يحوّل الغزل الألياف المفككة إلى خيط متصل، عبر سحب الألياف وإدخال الالتواء فيها. ويرتبط الغزل اليدوي التقليدي في كشمير باستخدام المغزل المعروف باسم «تشَرْخا».","قد تظهر في الخيوط المغزولة يدويًا اختلافات دقيقة، بينما يتيح الغزل الآلي قدرًا أكبر من الاتساق والإنتاج. لكن أيًا من الوصفين لا يحدد وحده تركيب الألياف."],b:["تصل الرحلة الآن إلى خيوط الباشمينا."]},
"05":{img:"../../images/lesson05-loom.jpg",v:"../../images/06.mp4",vt:"نسّاج يعمل على النول",vc:"مشاهد أصلية من ورشة سيفارا تُظهر النول وخيوط السدى وإيقاع النسيج اليدوي.",t:"تهيئة النول: من الخيوط إلى النسيج",i:"كيف يحوّل السدى واللحمة الخيوط إلى قماش.",h:"يمنح النول الخيوط بنيتها.",p:["يثبّت النول الخيوط ويساعد على تكوين القماش. تمتد خيوط السدى بالطول، بينما تمر خيوط اللحمة عرضيًا بينها.","تتطلب تهيئة السدى قياس الخيوط وترتيبها وتثبيتها مع ضبط الشد المناسب. ثم تتشابك خيوط السدى واللحمة بإيقاع مضبوط لتكوين النسيج.","يعتمد النسيج اليدوي التقليدي في كشمير على تنسيق الحركات والخبرة والانتباه إلى الشد والبنية وسرعة العمل."],b:["قد يكون النسيج البسيط أنيقًا في حد ذاته. والسوزني والكاني تقليدان حرفيان مختلفان، وقد يضافان في مراحل لاحقة أو يندمجان بطرق أخرى."]},
"06":{img:"../../images/lesson06-sozni.jpg",t:"سوزني: فن التطريز الكشميري اليدوي",i:"تطريز دقيق يتكوّن غرزة بعد غرزة.",h:"يتحول النسيج إلى مساحة يعمل عليها الإبرة.",p:["السوزني تقليد كشميري للتطريز اليدوي الدقيق. وقد تضم التصاميم الزهور والأوراق والأغصان والأشكال المستوحاة من أوراق البوتة والطيور والحواشي المتكررة.","قد يُنقل التصميم إلى القماش أو تُرسم علاماته الإرشادية أولًا. ثم يعمل الحرفي غرزة بعد غرزة، مع ضبط الاتجاه والمسافات والشد والألوان والتوازن.","يؤثر حجم التطريز وتعقيده في الوقت والجهد اللازمين لإنجازه. والسوزني تقليد حيّ، وليس مجرد زينة."],b:["الطبيعة مصدر مهم للإلهام في تصاميم المنسوجات الكشميرية."]},
"07":{img:"../../images/lesson07-kani.jpg",t:"كاني: فن النسيج الكشميري المزخرف",i:"تكوين التصميم داخل القماش أثناء عملية النسيج.",h:"في الكاني، يتكوّن النقش خلال النسيج نفسه.",p:["الكاني تقليد كشميري للنسيج ذي الأنماط والزخارف. فبدلًا من إضافة التصميم لاحقًا بالإبرة، يُبنى النقش أثناء نسج القماش.","تُستخدم أدوات كاني خشبية صغيرة لإدخال الخيوط الملونة في مواضع محددة. وتتطلب التصاميم المعقدة تخطيطًا دقيقًا ورسمًا منظمًا للنمط.","يختلف السوزني عن الكاني: فالسوزني تطريز يُضاف إلى نسيج موجود، أما الكاني فينشئ النقش من خلال عملية النسيج نفسها."],b:["يرتبط الكاني ارتباطًا وثيقًا بتقليد أقمشة جاماوار."]},
"08":{img:"../../images/lesson08-finished.jpg",t:"اللمسات النهائية للباشمينا: من النسيج إلى الشال المكتمل",i:"الفحص والتشطيب والإعداد الدقيق للقطعة.",h:"المرحلة الأخيرة جزء من حكاية القطعة.",p:["بعد النسيج وإتمام أي تطريز، تحتاج القطعة إلى الفحص والتشطيب المناسب. وقد يشمل ذلك إزالة الخيوط السائبة أو تصحيحها، والتنظيف أو الغسل بحسب نوع النسيج، والتجفيف والكيّ وتشطيب الحواف.","تختلف خطوات التشطيب وفق نوع الألياف والنسيج والتطريز والمنتج المقصود. وتتطلب المنسوجات الدقيقة تعاملًا حذرًا."],b:["التشطيب وحده لا يثبت نوع الألياف."]},
"09":{img:"../../images/lesson09-gi.jpg",t:"كيف تتعرّف إلى الباشمينا الأصيلة؟",i:"انظر إلى ما وراء الملمس والملصقات والاختبارات غير الرسمية.",h:"الأصالة هنا تتعلق أساسًا بتركيب الألياف.",p:["لا تُعد النعومة أو الملمس أو اختبار مرور الشال عبر الخاتم أو اختبار الحرق دليلًا علميًا قاطعًا على تركيب الألياف. فالأوصاف «منسوج يدويًا» و«مصنوع يدويًا» و«مغزول يدويًا» تصف طرق الإنتاج، ولا تثبت وحدها نوع الألياف.","يمكن للفحص المخبري أن يقدم دليلًا أقوى، ويعتمد الاختبار المناسب على السؤال المراد الإجابة عنه. وقد تشمل الوثائق الداعمة معلومات الألياف وتقارير الفحص وسجلات المؤشر الجغرافي عند انطباقها ومعلومات المورد أو الحرفي والسجلات التجارية.","يمكن للمشتري أن يسأل: ما تركيب الألياف؟ كيف غُزلت الخيوط؟ كيف نُسجت القطعة؟ وما الاختبارات أو الوثائق التي تدعم وصفها؟"],b:["لا يوجد اختبار سحري واحد يثبت الباشمينا."]},
"10":{img:"../../images/lesson10-cashmere.jpg",t:"الباشمينا والكشمير: فهم المصطلحين",i:"مصطلحان متقاربان قد يحملان سياقين جغرافيًا وثقافيًا مختلفين.",h:"الأسماء مهمة، لكن السياق أهم.",p:["الكشمير (Cashmere) مصطلح دولي واسع يُستخدم لوصف الألياف الحيوانية الدقيقة المستخرجة من أنواع معينة من الماعز المنتجة للكشمير. أما الباشمينا فترتبط بقوة بالهيمالايا وكشمير، وقد تشير إلى الألياف الدقيقة وإلى تقاليد المنسوجات الكشميرية.","لا يعني كون قطعة ملابس من الكشمير ومصنوعة في مكان آخر أنها شال باشمينا كشميري تقليدي. وبالمثل، لا يكفي الاسم وحده لإثبات تركيب الألياف.","اسأل ثلاثة أسئلة: ما نوع الألياف؟ من أين جاءت؟ وكيف صُنعت القطعة النهائية؟"],b:["تحمل الباشمينا في كشمير أيضًا تاريخًا من الغزل والنسيج والسوزني والكاني والجاماوار ومعرفة الحرفيين المتوارثة عبر الأجيال."]},
"11":{img:"../../images/02_artisan_fibre.jpg",t:"الحرفي: الأيدي البشرية وراء الباشمينا",i:"أصحاب المعرفة الذين يحوّلون الألياف إلى نسيج والتقاليد إلى ممارسة حيّة.",h:"الوقت مكوّن لا تراه العين.",p:["قد تشارك في صناعة قطعة الباشمينا مهارات متعددة، منها تهيئة الألياف والغزل والنسيج والتطريز ونسيج الكاني والتصميم والتشطيب.","تُكتسب المعرفة غالبًا بالممارسة والملاحظة والتكرار وتصحيح الأخطاء. ويسهم الحرفيون بمهارات مختلفة، وتعكس القطعة النهائية عملهم مجتمعًا.","يتطلب دعم الحرف أيضًا الاعتراف بأهمية الأجر العادل وظروف العمل الآمنة والتدريب والوصول إلى الأسواق ونسبة العمل إلى أصحابه عند الاقتضاء."],b:["تتعلّم الأيدي بالممارسة ما لا تستطيع الكتب تعليمه بالكامل."]},
"12":{img:"../../images/hero-real-workshop.jpg",t:"الباشمينا والمستقبل: صون تراث حيّ",i:"كيف تستمر المعرفة التقليدية بينما تتغير التكنولوجيا والأسواق.",h:"صون التراث لا يعني تجميده في الزمن.",p:["الباشمينا تقليد حيّ؛ يمكنه التطور مع الحفاظ على معارفه الأساسية ومعناه الثقافي.","يمكن للتكنولوجيا الحديثة أن تدعم معالجة الألياف وضبط الجودة والفحوص المخبرية والتوثيق والتصوير والتواصل والتجارة الدولية. ويمكن أن تتعايش العمليات اليدوية والآلية ما دامت أوصافها صادقة وواضحة.","يعتمد المستقبل أيضًا على سبل عيش الحرفيين والتدريب المهني ونقل الخبرة والاعتراف والوصول إلى الأسواق والتوثيق الجيد عبر الصور والمقابلات والفيديو والأرشيف."],b:["من ألياف الهيمالايا إلى المستقبل: تظل الطبيعة والمهارة والناس والمعرفة والسرد المسؤول عناصر مترابطة."]}
};
const id=new URLSearchParams(location.search).get("id")||"01",d=data[id]||data["01"],n=Number(id);
document.title=d.t+" — Civara Workshop";
document.getElementById("num").textContent="الدرس "+id;
document.getElementById("title").textContent=d.t;
document.getElementById("intro").textContent=d.i;
const image=document.getElementById("lesson-image");image.src=d.img;image.alt=d.t+" — صور ورشة سيفارا";
document.getElementById("body").innerHTML="<h2>"+d.h+"</h2>"+d.p.map(x=>"<p>"+x+"</p>").join("")+(d.v?"<div class='lesson-video'><p class='eyebrow'>"+(d.vt||"من الميدان")+"</p><h3>"+d.vt+"</h3><video controls muted playsinline preload='metadata' poster='"+d.img+"'><source src='"+d.v+"' type='video/mp4'>متصفحك لا يدعم تشغيل الفيديو.</video><p class='video-caption'>"+d.vc+"</p></div>":"")+"<div class='note'><strong>الفكرة الأساسية</strong><br>"+d.b.join("<br>")+"</div>";
if(n>1){const p=String(n-1).padStart(2,"0");const a=document.getElementById("prev");a.href="lesson.html?id="+p;a.textContent="← الدرس السابق · "+p}
if(n<12){const q=String(n+1).padStart(2,"0");const a=document.getElementById("next");a.href="lesson.html?id="+q;a.textContent="الدرس التالي · "+q+" →"}
</script>
